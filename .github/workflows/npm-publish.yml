# One-time setup: on npmjs.com add a GitHub Actions trusted publisher
# for repository ViateAI/viate-plugin-qwen-token-plan and workflow file
# npm-publish.yml. This workflow is not the publisher for any other repo.
# Later releases use OIDC. No npm token.
# The package must exist before this job can update it. Create it once with
# `npm publish --access public` from a checkout of the release tag while logged in.
name: Publish @viateai/plugin-qwen-token-plan

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --access public
